schema_version: 2
campaign: "Storm King's Thunder"
last_api_review: "2026-08-03"

providers:
  dnd5eapi-2014:
    name: "D&D 5e SRD API"
    base_url: "https://www.dnd5eapi.co/api/2014/monsters"
    image_base_url: "https://www.dnd5eapi.co"
    scope: "2014 SRD creatures only"

resolution_policy:
  order:
    - "current scene and explicit user corrections"
    - "campaign registry and published campaign images"
    - "D&D 5e SRD API"
    - "conservative visual inference"
  rules:
    - "Record a source for every canonical visual claim."
    - "Use API size, type, movement, attacks, equipment, and explicit traits as structured facts."
    - "Use the API image as a visual reference when anatomy is not described by structured fields."
    - "Do not infer anatomy from armor class, hit points, ability scores, or challenge rating."
    - "Do not treat a campaign-specific variant as the standard SRD creature."
    - "Label unsupported visual details as inference."

api_misses:
  - query: "yakfolk"
    result: "not-found"
    fallback: "campaign blog and published campaign images"
  - query: "yeti"
    result: "not-found"
    fallback: "campaign blog and published campaign images"

creatures:
  - id: "yakfolk"
    name: "Yakfolk"
    aliases:
      - "yak folk"
      - "yak-folk"
    resolution_status: "campaign-verified-non-srd"
    taxonomy:
      size: "large humanoid stature; exact rules size not established here"
      type: "anthropomorphic yak people"
    visual_profile:
      required_traits:
        - "upright humanoid body with a clearly bovine yak head"
        - "broad curved horns"
        - "long shaggy fur, especially around head, neck, shoulders, and lower body"
        - "large muscular build and heavy hands"
        - "mountain clothing, hides, leather, and weathered metal armor"
      common_equipment:
        - "heavy axes, polearms, or swords for warriors"
        - "robes, talismans, and spell effects for priestesses or evokers"
      palette:
        - "black, dark brown, gray, and dirty white fur"
        - "weathered brown leather and dark iron"
      environment:
        - "fortified high-mountain village"
        - "timber palisades, round huts, stone terraces, waterfalls, and grain fields"
    campaign_variants:
      - id: "yakfolk-warrior"
        traits:
          - "heavily built melee combatant"
      - id: "yakfolk-evoker"
        aliases:
          - "yakfolk priestess"
        traits:
          - "female spellcaster capable of summoning and healing in session 18"
      - id: "kartha-kaya"
        traits:
          - "named yakfolk leader"
          - "uses a flaming sword in session 18"
    established_capabilities:
      - "Some yakfolk use magic, including elemental summoning and healing."
      - "The campaign establishes a dark possession ritual that lets them enter and control other bodies."
    continuity_rules:
      - "Do not draw yakfolk as ordinary humans wearing horned helmets."
      - "Do not draw them as four-legged yaks or minotaurs with short cattle fur."
      - "Preserve the shaggy high-altitude yak silhouette shown in campaign images."
      - "Only show possession, spellcasting, or flaming weapons when the scene identifies the relevant variant."
    sources:
      - type: "blog"
        value: "src/content/blog/17-avventura.mdx:375"
        supports:
          - "anthropomorphic yak appearance"
          - "large stature"
          - "mountain village"
      - type: "blog"
        value: "src/content/blog/18-avventura.mdx:117-173"
        supports:
          - "evokers"
          - "earth elemental summoning"
          - "healing"
          - "Kartha-Kaya's flaming sword"
      - type: "blog"
        value: "src/content/blog/18-avventura.mdx:289"
        supports:
          - "possession ritual"
      - type: "campaign-image"
        value: "public/images/sessions/017/09_Yakfolk_v2_resized.jpg"
      - type: "campaign-image"
        value: "public/images/sessions/018/02_Scontro con Yakfolk_resized.webp"

