schema_version: 1
id: "skt-cinematic-realism-v2"
name: "Storm King's Thunder — Cinematic Realism"
setting: "Forgotten Realms"
base_style: >-
  Cinematic live-action fantasy realism, photorealistic character anatomy and
  faces, highly detailed weathered metal, leather, cloth and scales, physically
  credible material response, desaturated cold natural colors, deep atmospheric
  shadows, volumetric light and restrained warm practical highlights. Grounded
  dark-fantasy film still with natural depth and cinematic environmental storytelling.
style_reference:
  path: "skt-visual-agent/assets/style/cinematic-realism-v2.png"
  relative_to: "campaign_root"
  role: "rendering-style-only"
  approved: "2026-09-06: user selected the first Krjiv refining-mill test image."
style_rules:
  - "Resolve style_reference.path against campaign_root and supply that image as a style-only reference alongside the visible characters' original portraits when the tool's reference limit permits. If all reference slots are needed for character identity, prioritize those portraits and convey this style through the prompt; never omit a visible character's reference to make room for the style image."
  - "Apply this style to every character and scene by default, regardless of the rendering style of individual portraits."
  - "Use the style reference for rendering, materials, lighting, and grading only; do not import its cast, poses, equipment, or setting."
  - "Character portraits determine identity and equipment; the active global style determines rendering."
  - "This supersedes European graphic novel v1, including inked linework and painterly comic shading."
default_aspect_ratio: "16:9"
composition:
  - "Make the central action immediately readable."
  - "Prefer cinematic scene storytelling over a posed character lineup."
  - "Use clear foreground, middle ground, and background separation."
  - "Show the environment when it supports narrative understanding."
character_continuity:
  - "Use every available reference image for a visible named character."
  - "Preserve facial identity, species, build, distinctive features, and established equipment."
  - "Apply transformations, injuries, disguises, and equipment changes only when the current scene states them."
creature_rules:
  - "Use verified canonical anatomy when available."
  - "Keep different creature species visually distinct."
  - "Do not replace an identified creature with a generic humanoid or animal."
negative_constraints:
  - "no comic-book inking, crosshatching, cel shading, or graphic-novel rendering"
  - "no painterly illustration finish"
  - "no anime or cartoon proportions"
  - "no glossy videogame rendering"
  - "no plastic skin"
  - "no exaggerated superhero anatomy"
  - "no oversaturated colors"
  - "no modern objects"
  - "no written text unless explicitly requested"
  - "no duplicate characters"
  - "no incorrect weapons or species"
